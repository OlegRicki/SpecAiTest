[project]
name = "specaitest"
version = "0.1.0"
description = "SpecAiTest: browser test generation from test specifications"
requires-python = ">=3.14"
dependencies = [
    "pytest>=8.0.0",
    "playwright>=1.40.0",
    "pymupdf>=1.24.0",
    "python-docx>=1.1.0",
    "requests>=2.32.0",
    "allure-pytest>=2.16.0",
    "python-pptx>=1.0.2",
    "pypdf>=6.19.0",
    "openai>=3.22.1",
    "pyyaml>=6.0.2",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-v --tb=short --alluredir=allure-results --clean-alluredir"
markers = [
    "llm: проверка смысла ответа чата через LLM (skip, если нет доступа)",
    "last: тест выполняется в конце прогона (разделы «Порядок: последний»)",
    "allure_dynamic_story: тест самостоятельно задаёт story для группировки Allure",
]

[tool.uv]
package = false
